<h1>Pilot Room</h1>
@for (pilot of pilots; track pilot) {
  <app-pilot
    [pilot]="pilot"
    [ngClass]="{selected: selectedPilot === pilot}">
    @if (selectedPilot !== pilot) {
      <button
        class="select-button" (click)="select(pilot)">
        Zaznacz
      </button>
    } @else {
      <button class="deselect-button" (click)="select(null)">
        Odznacz
      </button>
    }
    <button class="edit-button" [routerLink]="['pilots', pilot.id]">
      Edytuj
    </button>
  </app-pilot>
}
<button class="add-button" [routerLink]="['pilots', 'new']">
  Dodaj
</button>
